<html lang="zh-TW">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b5e20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="統聯中台配車">
  <title>統聯客運 & 中台灣客運 車輛配站查詢</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #2e7d32;
      --primary-dark: #0f3d13;
      --ubus-green: #007934;
      --ubus-bg: #e8f5e9;
      --ubus-text: #1b5e20;
      --ct-orange: #e65100;
      --ct-bg: #fff3e0;
      --ct-text: #bf360c;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-variant: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --radius: 14px;
      --shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.07), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* App Header (Android Style) */
    header {
      background: linear-gradient(135deg, #134e19 0%, #1e7025 60%, #2e8b35 100%);
      color: white;
      padding: env(safe-area-inset-top, 16px) 20px 24px;
      box-shadow: 0 4px 20px rgba(19, 78, 25, 0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .app-subtitle {
      font-size: 0.8rem;
      opacity: 0.85;
      font-weight: 400;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }

    .action-btn:active {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(0.96);
    }

    /* Search Box */
    .search-bar-wrap {
      position: relative;
      margin-top: 8px;
    }

    .search-input {
      width: 100%;
      background: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 13px 44px 13px 44px;
      font-size: 1rem;
      color: var(--text);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.4), 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: #94a3b8;
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: #e2e8f0;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: #64748b;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 16px 30px;
    }

    /* Filters Section */
    .filters-section {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .filter-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chips-group:last-child {
      margin-bottom: 0;
    }

    .chip {
      padding: 6px 14px;
      background: var(--surface-variant);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip .chip-count {
      font-size: 0.75rem;
      padding: 2px 6px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 10px;
    }

    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .chip.active .chip-count {
      background: rgba(255, 255, 255, 0.25);
      color: white;
    }

    .chip-ubus.active {
      background: var(--ubus-green);
      border-color: var(--ubus-green);
    }

    .chip-ct.active {
      background: var(--ct-orange);
      border-color: var(--ct-orange);
    }

    .select-wrap {
      position: relative;
      margin-top: 6px;
    }

    .custom-select {
      width: 100%;
      padding: 9px 14px;
      background: var(--surface-variant);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    /* Stats Overview */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stats-count strong {
      color: var(--primary);
      font-size: 1.05rem;
      font-weight: 800;
    }

    /* Grid of Cards */
    .bus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .bus-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .bus-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.1);
      border-color: #cbd5e1;
    }

    .bus-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
    }

    .bus-card.ubus::before {
      background: var(--ubus-green);
    }

    .bus-card.ct::before {
      background: var(--ct-orange);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .company-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }

    .company-badge.ubus {
      background: var(--ubus-bg);
      color: var(--ubus-text);
    }

    .company-badge.ct {
      background: var(--ct-bg);
      color: var(--ct-text);
    }

    .station-badge {
      font-size: 0.85rem;
      font-weight: 800;
      color: #0f172a;
      background: #f1f5f9;
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .station-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .plate-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .copy-hint {
      font-size: 0.75rem;
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500;
      color: #94a3b8;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .bus-card:hover .copy-hint {
      opacity: 1;
    }

    .model-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
      background: #f8fafc;
      padding: 6px 10px;
      border-radius: 8px;
      margin-top: 6px;
      border-left: 2px solid #cbd5e1;
      word-break: break-word;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* PWA Install Banner */
    .install-banner {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .install-text {
      font-size: 0.85rem;
      color: #065f46;
      font-weight: 600;
    }

    .install-btn {
      background: #059669;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .bus-grid {
        grid-template-columns: 1fr;
      }
      .plate-number {
        font-size: 1.35rem;
      }
    }
  </style>
</head>

  <header>
    <div class="header-top">
      <div class="header-title-wrap">
        <div class="app-icon">🚌</div>
        <div>
          <div class="app-title">統聯 & 中台灣客運</div>
          <div class="app-subtitle">車輛配站動態查詢系統 (全 361 輛)</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="action-btn" id="installAppBtn" style="display:none;" onclick="triggerInstall()">
          <span>📥</span> 安裝 APK/App
        </button>
      </div>
    </div>

    <div class="search-bar-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="輸入車牌 (例: EAL-1232、050) 或站名、車型..." autocomplete="off">
      <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
    </div>
  </header>

  <main>
    <!-- PWA Helper Hint for Android -->
    <div class="install-banner" id="pwaBanner">
      <div class="install-text">
        📱 <strong>免下載 APK 直接安裝：</strong> 點擊瀏覽器選單「新增至主畫面」或「安裝應用程式」，即可離線秒開！
      </div>
      <button class="install-btn" onclick="shareOrBookmark()">分享 / 收藏</button>
    </div>

    <!-- Filters -->
    <div class="filters-section">
      <!-- 客運公司篩選 -->
      <div class="filter-label">客運公司</div>
      <div class="chips-group" id="companyChips">
        <div class="chip active" data-company="all" onclick="setCompany('all')">全部 <span class="chip-count">361</span></div>
        <div class="chip chip-ubus" data-company="統聯客運" onclick="setCompany('統聯客運')">統聯客運 <span class="chip-count">235</span></div>
        <div class="chip chip-ct" data-company="中台灣客運" onclick="setCompany('中台灣客運')">中台灣客運 <span class="chip-count">126</span></div>
      </div>

      <!-- 配站快速篩選 -->
      <div class="filter-label" style="margin-top: 10px;">配屬場站</div>
      <div class="chips-group" id="stationChips">
        <div class="chip active" data-station="all" onclick="setStation('all')">全部場站</div>
        <div class="chip" data-station="新福" onclick="setStation('新福')">新福 <span class="chip-count">96</span></div>
        <div class="chip" data-station="清水" onclick="setStation('清水')">清水 <span class="chip-count">74</span></div>
        <div class="chip" data-station="中科" onclick="setStation('中科')">中科 <span class="chip-count">65</span></div>
        <div class="chip" data-station="烏日" onclick="setStation('烏日')">烏日 <span class="chip-count">49</span></div>
        <div class="chip" data-station="豐勢" onclick="setStation('豐勢')">豐勢 <span class="chip-count">41</span></div>
        <div class="chip" data-station="霧峰" onclick="setStation('霧峰')">霧峰 <span class="chip-count">36</span></div>
      </div>

      <!-- 車型篩選 -->
      <div class="filter-label" style="margin-top: 10px;">車輛車型</div>
      <div class="select-wrap">
        <select id="modelSelect" class="custom-select" onchange="applyFilters()">
          <option value="all">所有車型 (全部 24 種規格)</option>
        </select>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stats-count">查詢結果：<strong id="resultCount">361</strong> 輛</div>
      <div id="filterSummary">顯示所有資料</div>
    </div>

    <!-- Bus Cards Container -->
    <div class="bus-grid" id="busGrid">
      <!-- Dynamic rendering via JS -->
    </div>
  </main>

  <div class="toast" id="toast">
    <span>📋</span> 已複製車牌至剪貼簿！
  </div>

    let currentCompany = 'all';
    let currentStation = 'all';
    let deferredPrompt = null;

    // Initialize Models in dropdown
    function initModels() {
      const select = document.getElementById('modelSelect');
      const models = [...new Set(BUS_DATA.map(d => d.model))].sort();
      models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        select.appendChild(opt);
      });
    }

    // Filtering logic
    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase().replace(/-/g, '');
      const selectedModel = document.getElementById('modelSelect').value;

      document.getElementById('clearBtn').style.display = query ? 'flex' : 'none';

      const filtered = BUS_DATA.filter(item => {
        // Company match
        if (currentCompany !== 'all' && item.company !== currentCompany) return false;
        // Station match
        if (currentStation !== 'all' && item.station !== currentStation) return false;
        // Model match
        if (selectedModel !== 'all' && item.model !== selectedModel) return false;

        // Search text match (plate, clean plate, station, model, company)
        if (query) {
          const cleanPlate = item.plate.toLowerCase().replace(/-/g, '');
          const matchPlate = item.plate.toLowerCase().includes(query) || cleanPlate.includes(query);
          const matchStation = item.station.toLowerCase().includes(query);
          const matchModel = item.model.toLowerCase().includes(query);
          const matchCompany = item.company.toLowerCase().includes(query);
          if (!matchPlate && !matchStation && !matchModel && !matchCompany) return false;
        }

        return true;
      });

      renderGrid(filtered);
    }

    // Render Grid
    function renderGrid(data) {
      const grid = document.getElementById('busGrid');
      const countEl = document.getElementById('resultCount');
      countEl.textContent = data.length;

      if (data.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <h3>查無相符車輛資料</h3>
            <p style="margin-top: 6px; font-size: 0.85rem;">請嘗試縮短搜尋關鍵字或清除篩選條件</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = data.map(bus => {
        const isUbus = bus.company === '統聯客運';
        const cardClass = isUbus ? 'ubus' : 'ct';
        return `
          <div class="bus-card ${cardClass}" onclick="copyPlate('${bus.plate}')">
            <div class="card-top">
              <span class="company-badge ${cardClass}">${bus.company}</span>
              <span class="station-badge">
                <span class="station-dot"></span>
                ${bus.station}站
              </span>
            </div>
            <div class="plate-number">
              ${bus.plate}
              <span class="copy-hint">點擊複製</span>
            </div>
            <div class="model-info">
              🚘 ${bus.model}
            </div>
          </div>
        `;
      }).join('');
    }

    function setCompany(company) {
      currentCompany = company;
      document.querySelectorAll('#companyChips .chip').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-company') === company);
      });
      applyFilters();
    }

    function setStation(station) {
      currentStation = station;
      document.querySelectorAll('#stationChips .chip').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-station') === station);
      });
      applyFilters();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      input.focus();
      applyFilters();
    }

    function copyPlate(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`已複製車牌「${text}」至剪貼簿！`);
      }).catch(() => {
        showToast(`車牌：${text}`);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerHTML = `<span>📋</span> ${msg}`;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    function shareOrBookmark() {
      if (navigator.share) {
        navigator.share({
          title: '統聯與中台灣客運車輛配站查詢',
          text: '統聯客運與中台灣客運全 361 輛車輛配站線上查詢',
          url: window.location.href,
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        showToast('已複製網頁連結，可在瀏覽器加入主畫面！');
      }
    }

    // PWA Install Prompt handling
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.style.display = 'inline-flex';
    });

    function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          deferredPrompt = null;
          document.getElementById('installAppBtn').style.display = 'none';
        });
      } else {
        alert('請點擊瀏覽器右上角選單 (三個點)，選擇「安裝應用程式」或「加到主畫面」即可安裝成 App！');
      }
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', applyFilters);

    // Initial run
    initModels();
    applyFilters();

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fail:', err));
      });
    }
  </script>
</body>
</html>
